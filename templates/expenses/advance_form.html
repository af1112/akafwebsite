{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">{% trans "Request Advance" %}</h5>
            <a href="{% url 'dashboard' %}" class="btn btn-sm btn-light"><i class="fas fa-times"></i></a>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">{% trans "Amount" %} ({{ user_currency_code }})</label>
                    <div class="input-group">
                        <span class="input-group-text">{{ user_currency_code }}</span>
                        {{ form.amount }}
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Date" %}</label>
                    {{ form.date }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Payment Mode" %}</label>
                    {{ form.paid_through }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Reference Number" %}</label>
                    {{ form.reference_number }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Statement (Optional)" %}</label>
                    {{ form.trip }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Notes" %}</label>
                    {{ form.notes }}
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">{% trans "Request Advance" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
