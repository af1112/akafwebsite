<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Fekri | Future Tech Visionary</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="overlay"></div>

    <main class="container">
        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="fa">FA</button>
            <button class="lang-btn" data-lang="ar">AR</button>
        </div>

        <!-- Profile Section -->
        <section class="profile-card glass-panel" data-tilt>
            <div class="profile-header">
                <div class="avatar-container">
                    <div class="cyber-ring"></div>
                    <img src="profile_placeholder.jpg" alt="Ali Fekri" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=Ali+Fekri&background=00f3ff&color=000'">
                </div>
                <h1 class="glitch" data-text="Ali Fekri">Ali Fekri</h1>
                <h2 class="typing-text">System Architect & Robotics Engineer</h2>
            </div>

            <!-- Stats/Info Grid -->
            <div class="info-grid">
                <div class="info-item">
                    <i class="fas fa-microchip"></i>
                    <span data-i18n="role">Tech Lead</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-building"></i>
                    <span data-i18n="company">AKAF Group</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span data-i18n="location">Muscat, Oman</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="action-buttons">
                <a href="#" class="cyber-btn primary" id="save-contact">
                    <span class="btn-content">
                        <i class="fas fa-user-plus"></i>
                        <span data-i18n="saveContact">Save Contact</span>
                    </span>
                    <div class="glitch-effect"></div>
                </a>
                <a href="Resume2026.docx" class="cyber-btn secondary" download>
                    <span class="btn-content">
                        <i class="fas fa-file-download"></i>
                        <span data-i18n="downloadResume">Download Resume</span>
                    </span>
                </a>
            </div>

            <!-- Social Links -->
            <div class="social-links">
                <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-telegram-plane"></i></a>
                <a href="mailto:info@akafco.com" class="social-icon"><i class="fas fa-envelope"></i></a>
            </div>
        </section>

        <!-- Services/Skills Section -->
        <section class="details-card glass-panel">
            <h3 class="section-title">
                <i class="fas fa-terminal"></i> <span data-i18n="skillsTitle">Core Systems</span>
            </h3>
            <div class="skills-container">
                <div class="skill-bar">
                    <div class="skill-info">
                        <span>Robotics</span>
                        <span>95%</span>
                    </div>
                    <div class="progress-line" data-width="95%"><span></span></div>
                </div>
                <div class="skill-bar">
                    <div class="skill-info">
                        <span>AI & Machine Learning</span>
                        <span>90%</span>
                    </div>
                    <div class="progress-line" data-width="90%"><span></span></div>
                </div>
                <div class="skill-bar">
                    <div class="skill-info">
                        <span>Full Stack Dev</span>
                        <span>85%</span>
                    </div>
                    <div class="progress-line" data-width="85%"><span></span></div>
                </div>
                <div class="skill-bar">
                    <div class="skill-info">
                        <span>IoT Solutions</span>
                        <span>92%</span>
                    </div>
                    <div class="progress-line" data-width="92%"><span></span></div>
                </div>
            </div>
        </section>
        
        <footer class="footer">
            <p data-i18n="copyright">© 2026 Ali Fekri. Powered by Future Tech.</p>
        </footer>
    </main>

    <!-- Vanilla Tilt for 3D Effect -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="script.js?v=1.0"></script>
</body>
</html>
